name: MCP gRPC Interop

on:
  pull_request:
    paths:
      - 'src/vs/base/common/protobuf/**'
      - 'src/vs/base/common/grpc/**'
      - 'src/vs/base/node/grpcChannel.ts'
      - 'src/vs/base/node/grpcServer.ts'
      - 'src/vs/base/test/common/protobuf/**'
      - 'src/vs/base/test/common/grpc/**'
      - 'src/vs/base/test/node/grpcChannel.test.ts'
      - 'src/vs/base/test/node/grpcServer.test.ts'
      - 'src/vs/base/test/node/http2FrameProxy.ts'
      - 'src/vs/platform/mcp/**'
      - 'src/vs/workbench/api/node/extHostMcpGrpc.ts'
      - 'src/vs/workbench/api/node/extHostMcpNode.ts'
      - 'src/vs/workbench/api/node/proxyResolver.ts'
      - 'src/vs/workbench/api/common/extHostMcp.ts'
      - 'src/vs/workbench/api/browser/mainThreadMcp.ts'
      - 'src/vs/workbench/contrib/mcp/common/mcpServerRequestHandler.ts'
      - 'src/vs/workbench/contrib/mcp/common/mcpTypes.ts'
      - 'src/vs/workbench/api/test/node/extHostMcpGrpc*.ts'
      - 'test/mcp-grpc/**'
      - '.github/workflows/mcp-grpc-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-grpc-interop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  grpc-js-interop:
    name: grpc-js interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci --ignore-scripts --no-workspaces && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client
        run: npm run transpile-client

      - name: Install MCP gRPC interop dependencies
        run: npm ci --prefix test/mcp-grpc --no-audit --no-fund

      - name: 🧪 Run grpc-js and protobufjs interop checks
        run: npm --prefix test/mcp-grpc test

      # One brace pattern: the node test runner takes a single --runGlob (glob@5).
      - name: 🧪 Run protobuf, gRPC and MCP gRPC unit tests
        run: npm run test-node -- --runGlob "{**/{protobuf,grpc}/**/*.test.js,**/{grpcChannel,grpcServer}.test.js,**/mcp/test/**/*Grpc*.test.js,**/api/test/node/extHostMcpGrpc.test.js}"

      - name: 🧪 Run the VS Code gRPC client against the grpc-js fixture (tunnel and typed)
        run: |
          node test/mcp-grpc/src/fixtureServer.ts > fixture.log 2>&1 &
          port=
          for i in $(seq 1 100); do
            port=$(sed -n 's/^READY:\([0-9][0-9]*\)$/\1/p' fixture.log)
            [ -n "$port" ] && break
            sleep 0.2
          done
          if [ -z "$port" ]; then cat fixture.log; exit 1; fi
          MCP_GRPC_INTEROP_PORT=$port MCP_GRPC_INTEROP_TYPED=1 npm run test-node -- --run src/vs/workbench/api/test/node/extHostMcpGrpc.interop.test.ts

  # The VS Code gRPC client against the zig-sdk conformance server (both
  # bindings), built from a pinned tag. Not required for PR gating.
  zig-interop:
    name: zig-sdk interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout zig-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChristianPresley/zig-sdk
          ref: v0.5.2
          path: .build/zig-sdk
          persist-credentials: false

      # zig-sdk's setup-zig action reads .github/community-mirrors.txt from the
      # workspace root (this checkout, not zig-sdk's), so it cannot run here:
      # install the toolchain pinned in zig-sdk's zig.json from ziglang.org.
      - name: Resolve the Zig toolchain pinned by zig-sdk
        id: zig
        working-directory: .build/zig-sdk
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          python3 - "$target" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re, sys
          target = sys.argv[1]
          with open('.github/zig.json') as f:
              pin = json.load(f)
          version = pin['version']
          entry = pin['targets'][target]
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              sys.exit(f'unexpected Zig version {version!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', entry['shasum']):
              sys.exit(f'unexpected sha256 {entry["shasum"]!r}')
          if not entry['tarball'].startswith(f'https://ziglang.org/download/{version}/'):
              sys.exit(f'the {target} tarball is not on ziglang.org: {entry["tarball"]}')
          print(f'version={version}')
          print(f'target={target}')
          print(f'tarball={entry["tarball"]}')
          print(f'shasum={entry["shasum"]}')
          print(f'dir={os.environ["RUNNER_TEMP"]}/zig-{version}-{target}')
          PY

      - name: Restore the Zig toolchain
        id: zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.zig.outputs.dir }}
          key: zig-${{ steps.zig.outputs.version }}-${{ steps.zig.outputs.target }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        working-directory: .build/zig-sdk
        env:
          ZIG_TARBALL: ${{ steps.zig.outputs.tarball }}
          ZIG_SHASUM: ${{ steps.zig.outputs.shasum }}
          ZIG_DIR: ${{ steps.zig.outputs.dir }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$(basename "$ZIG_TARBALL")"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$ZIG_TARBALL"
          echo "$ZIG_SHASUM  $archive" | sha256sum --check --strict -
          rm -rf "$ZIG_DIR"
          mkdir -p "$ZIG_DIR"
          tar -xJf "$archive" -C "$ZIG_DIR" --strip-components=1
          rm -f "$archive"

      - name: Add Zig to the PATH
        env:
          ZIG_DIR: ${{ steps.zig.outputs.dir }}
        run: |
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Build the zig-sdk conformance server
        working-directory: .build/zig-sdk
        run: |
          zig version
          zig build conformance-server -Doptimize=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci --ignore-scripts --no-workspaces && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client
        run: npm run transpile-client

      - name: Start the zig-sdk conformance server
        run: |
          .build/zig-sdk/zig-out/bin/mcp-conformance-server --port 3000 --grpc-port 50051 --grpc-typed > server.log 2>&1 &
          for i in $(seq 1 100); do
            grep -q 'listening for gRPC' server.log && exit 0
            sleep 0.2
          done
          cat server.log
          exit 1

      - name: 🧪 Run the VS Code gRPC client against the zig-sdk server (tunnel and typed)
        run: npm run test-node -- --run src/vs/workbench/api/test/node/extHostMcpGrpc.interop.test.ts
        env:
          MCP_GRPC_INTEROP_PORT: 50051
          MCP_GRPC_INTEROP_TYPED: 1

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-sdk-server-log
          path: server.log
          if-no-files-found: ignore

  # Foreign clients against VS Code's MCP gateway as a gRPC server: the test
  # starts `mcpGatewayConformanceMain.js --grpc` and calls all eight typed RPCs
  # and the tunnel from @grpc/grpc-js, then the tunnel from curl over HTTP/2
  # with prior knowledge.
  gateway-grpc-js-interop:
    name: gateway gRPC listener (grpc-js, curl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci --ignore-scripts --no-workspaces && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client
        run: npm run transpile-client

      - name: Install MCP gRPC interop dependencies
        run: npm ci --prefix test/mcp-grpc --no-audit --no-fund

      - name: 🧪 Run grpc-js and curl against the gateway's gRPC listener
        run: |
          curl --version
          node --test test/mcp-grpc/src/gatewayInterop.test.ts
        env:
          MCP_GATEWAY_GRPC_INTEROP: 1

  # The zig-sdk example client (`grpc_client`: tunnel only, discovers, lists
  # and calls `add`) against the gateway's default route, built from a pinned
  # tag. Not required for PR gating.
  gateway-zig-interop:
    name: gateway gRPC listener (zig-sdk client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout zig-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChristianPresley/zig-sdk
          ref: v0.5.2
          path: .build/zig-sdk
          persist-credentials: false

      # As in the zig-interop job: the toolchain pinned in zig-sdk's zig.json, from ziglang.org.
      - name: Resolve the Zig toolchain pinned by zig-sdk
        id: zig
        working-directory: .build/zig-sdk
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          python3 - "$target" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re, sys
          target = sys.argv[1]
          with open('.github/zig.json') as f:
              pin = json.load(f)
          version = pin['version']
          entry = pin['targets'][target]
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              sys.exit(f'unexpected Zig version {version!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', entry['shasum']):
              sys.exit(f'unexpected sha256 {entry["shasum"]!r}')
          if not entry['tarball'].startswith(f'https://ziglang.org/download/{version}/'):
              sys.exit(f'the {target} tarball is not on ziglang.org: {entry["tarball"]}')
          print(f'version={version}')
          print(f'target={target}')
          print(f'tarball={entry["tarball"]}')
          print(f'shasum={entry["shasum"]}')
          print(f'dir={os.environ["RUNNER_TEMP"]}/zig-{version}-{target}')
          PY

      - name: Restore the Zig toolchain
        id: zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.zig.outputs.dir }}
          key: zig-${{ steps.zig.outputs.version }}-${{ steps.zig.outputs.target }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        working-directory: .build/zig-sdk
        env:
          ZIG_TARBALL: ${{ steps.zig.outputs.tarball }}
          ZIG_SHASUM: ${{ steps.zig.outputs.shasum }}
          ZIG_DIR: ${{ steps.zig.outputs.dir }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$(basename "$ZIG_TARBALL")"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$ZIG_TARBALL"
          echo "$ZIG_SHASUM  $archive" | sha256sum --check --strict -
          rm -rf "$ZIG_DIR"
          mkdir -p "$ZIG_DIR"
          tar -xJf "$archive" -C "$ZIG_DIR" --strip-components=1
          rm -f "$archive"

      - name: Add Zig to the PATH
        env:
          ZIG_DIR: ${{ steps.zig.outputs.dir }}
        run: |
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Build the zig-sdk example gRPC client
        working-directory: .build/zig-sdk
        run: |
          zig version
          zig build examples -Doptimize=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci --ignore-scripts --no-workspaces && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Transpile client
        run: npm run transpile-client

      - name: Install MCP gRPC interop dependencies
        run: npm ci --prefix test/mcp-grpc --no-audit --no-fund

      - name: 🧪 Run the zig-sdk example client against the gateway's gRPC listener
        run: node --test --test-name-pattern "zig-sdk" test/mcp-grpc/src/gatewayInterop.test.ts
        env:
          MCP_GATEWAY_GRPC_INTEROP: 1
          MCP_ZIG_GRPC_CLIENT: ${{ github.workspace }}/.build/zig-sdk/zig-out/bin/grpc_client
