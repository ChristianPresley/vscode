# Known failures of the scenarios the requirement sets run but do not score
# (`not_scored` in the suite's requirements/<revision>.yaml). run.ts runs each
# of them alone, with `--force`, at every revision that lists it and judges it
# against this file: a failure that is not listed fails the run, and so does a
# listed scenario or check that passes.
#
# The client implements none of the authorization extensions (OAuth client
# credentials, enterprise-managed authorization, DPoP, workload identity
# federation), so their six scenarios are listed whole.
client:
  - auth/client-credentials-basic
  - auth/client-credentials-jwt
  - auth/dpop
  - auth/dpop-nonce
  - auth/enterprise-managed-authorization
  - auth/wif-jwt-bearer
# The server leg runs against the gateway fixture (milestone M6), which serves
# the Tasks extension (`io.modelcontextprotocol/tasks`, SEP-2663, milestone
# M9): every functional check of the ten `tasks-*` scenarios passes. The check
# `wire-schema-valid` validates each `tools/call` result against the
# CallToolResult schema of the core specification, which requires `content`; a
# CreateTaskResult of the extension has none, so the check fails in the eight
# scenarios that create a task. `tasks-required-task-error` creates no task and
# `tasks-status-notifications` reports no checks.
server:
  - tasks-lifecycle:wire-schema-valid
  - tasks-capability-negotiation:wire-schema-valid
  - tasks-wire-fields:wire-schema-valid
  - tasks-request-state-removal:wire-schema-valid
  - tasks-mrtr-input:wire-schema-valid
  - tasks-request-headers:wire-schema-valid
  - tasks-dispatch-and-envelope:wire-schema-valid
  - tasks-mrtr-composition:wire-schema-valid
