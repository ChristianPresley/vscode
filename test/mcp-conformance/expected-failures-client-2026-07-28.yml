# Known failures of the scored client scenarios of `--requirements 2026-07-28`.
# test/mcp-conformance/run.ts passes this file to every scored client run at
# 2026-07-28; the suite then fails on any other failing (or WARNING) check and on
# every listed check that passes.
#
# Each entry names one check, `<scenario>:<check-id>`. The conformance client
# has no OAuth support yet, so every authorization scenario stops at the first
# 401 and fails the checks of the flow it never runs. Milestone M5 implements
# OAuth and empties this list. Refresh it with
# `node test/mcp-conformance/run.ts client --requirements 2026-07-28 --update-baseline`.
